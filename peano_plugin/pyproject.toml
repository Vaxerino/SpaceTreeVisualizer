[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spacetree-visualizer"
version = "0.1.0"
description = "Real-time 3D browser debugger for Peano4/ExaHype2 AMR simulations"
requires-python = ">=3.9"
dependencies = ["jinja2>=3.0"]

[tool.setuptools.package-dir]
"peano_plugin" = "."

[tool.setuptools.packages]
find = {}
