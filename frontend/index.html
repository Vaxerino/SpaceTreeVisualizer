<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceTreeVisualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:        #141414;
        --panel-bg:  #1e1e1e;
        --border:    #2e2e2e;
        --text:      #c8c8c8;
        --muted:     #666;
        --accent:    #4a9eff;
        --label:     #888;
        --mono:      'JetBrains Mono', 'Fira Code', monospace;
        --panel-w:   240px;
        --detail-w:  260px;
        --bottom-h:  36px;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        font-size: 13px;
        overflow: hidden;
        height: 100vh;
      }

      #app {
        display: grid;
        grid-template-columns: var(--panel-w) 1fr var(--detail-w);
        grid-template-rows: 1fr var(--bottom-h);
        grid-template-areas:
          "left canvas right"
          "bottom bottom bottom";
        height: 100vh;
      }

      #canvas {
        grid-area: canvas;
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }

      /* ---- Left panel ---- */
      .control-panel {
        grid-area: left;
        background: var(--panel-bg);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      /* ---- Right panel ---- */
      .detail-panel {
        grid-area: right;
        background: var(--panel-bg);
        border-left: 1px solid var(--border);
        overflow-y: auto;
        padding: 10px 12px;
      }

      /* ---- Bottom bar ---- */
      .timeline-bar {
        grid-area: bottom;
        background: var(--panel-bg);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 12px;
      }

      /* ---- Sections ---- */
      .panel-section {
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .panel-section:last-child { border-bottom: none; }

      /* ---- Labels ---- */
      .label {
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--label);
        text-transform: uppercase;
      }
      .label.small { font-size: 9px; }

      /* ---- Monospace ---- */
      .mono { font-family: var(--mono); font-size: 12px; }
      .mono.small { font-size: 11px; }
      .muted { color: var(--muted); }

      /* ---- Form controls ---- */
      select, input[type="number"] {
        background: #2a2a2a;
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 3px;
        width: 100%;
        outline: none;
      }
      select:focus, input:focus { border-color: var(--accent); }

      .range-row {
        display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        align-items: center;
        gap: 4px;
      }
      .num-input { width: 100% !important; }

      .level-slider-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .level-slider-row input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 12px;
        cursor: pointer;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 13px; height: 13px;
      }

      /* ---- Detail table ---- */
      .detail-table {
        width: 100%;
        border-collapse: collapse;
      }
      .detail-table td {
        padding: 2px 4px;
        vertical-align: top;
      }
      .detail-table .right { text-align: right; color: var(--text); }
      .detail-table .section-header td {
        padding-top: 8px;
        padding-bottom: 2px;
      }

      /* ---- Status indicator ---- */
      .status-indicator {
        font-family: var(--mono);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 3px;
        background: #2a2a2a;
      }
      .status-indicator.live    { color: #44cc66; }
      .status-indicator.paused  { color: #ffaa33; }
      .status-indicator.disconnected { color: var(--muted); }

      /* ---- Button ---- */
      .btn {
        background: #2a2a2a;
        border: 1px solid var(--border);
        color: var(--accent);
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 3px;
        cursor: pointer;
      }
      .btn:hover { background: #333; border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
